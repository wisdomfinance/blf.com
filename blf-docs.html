<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Black Latex Fist ($BLF) Docs</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0a0710;--panel:#140d20;--line:#2b1d44;--text:#efe9f8;--mute:#a698c0;--pink:#ff2e93;--purple:#9b5cff;--accent-text:#fff}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#faf7ff;--panel:#fff;--line:#e3d9f5;--text:#1b1228;--mute:#6a5b86;--pink:#d6137a;--purple:#6d35d6}}
:root[data-theme="dark"]{--bg:#0a0710;--panel:#140d20;--line:#2b1d44;--text:#efe9f8;--mute:#a698c0;--pink:#ff2e93;--purple:#9b5cff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--panel);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header img{width:34px;height:34px;border-radius:50%}
header b{flex:1;font-size:16px}
button{font:inherit;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.layout{display:flex;max-width:1100px;margin:0 auto}
nav{width:250px;padding:16px;border-right:1px solid var(--line);position:sticky;top:60px;align-self:flex-start;height:calc(100vh - 60px);overflow:auto}
nav input{width:100%;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);margin-bottom:12px;font:inherit}
nav a{display:block;padding:8px 10px;border-radius:8px;color:var(--mute);text-decoration:none}
nav a:hover{color:var(--text)}
nav a.on{background:rgba(155,92,255,.18);color:var(--pink);font-weight:600}
main{flex:1;min-width:0;padding:24px 20px 60px}
h1{font-size:32px;line-height:1.2;margin:0 0 6px}
h2{margin-top:28px}
.sub{color:var(--mute);margin:0 0 20px;font-size:18px}
.hero{display:block;width:190px;max-width:60%;border-radius:50%;margin:8px 0 20px;box-shadow:0 0 40px rgba(155,92,255,.45)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:16px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat b{display:block;font-size:26px;color:var(--pink)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%}
td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line)}
.ca{word-break:break-all;font-family:ui-monospace,Menlo,monospace;font-size:14px}
a.link{color:var(--pink)}
.pn{display:flex;gap:12px;margin-top:36px}
.pn a{flex:1;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--text);text-decoration:none;background:var(--panel)}
.pn small{display:block;color:var(--mute)}
.pn a:last-child{text-align:right}
footer{color:var(--mute);font-size:13px;margin-top:28px}
.menu{display:none}
@media (max-width:760px){
 .menu{display:inline-block}
 nav{display:none;position:fixed;left:0;right:0;top:calc(58px + env(safe-area-inset-top,0px));width:auto;height:auto;max-height:70vh;background:var(--panel);z-index:8}
 nav.open{display:block}
 h1{font-size:26px}
}
</style>
</head>

{id:"chart",t:"Live Chart",h:function(){var u="https://dexscreener.com/solana/HYR1ZDFj5Fr89RUVWhJTAQAsovm51dVFDXiqt7tpekSh";return '<h1>Live Chart</h1><p class="sub">$BLF price, volume and trades</p>'+'<div class="card" style="padding:0;overflow:hidden"><iframe title="BLF live chart" src="'+u+'?embed=1&theme=dark&trades=0&info=0" style="width:100%;height:480px;border:0" loading="lazy"></iframe></div>'+'<p><a class="link" href="'+u+'" target="_blank" rel="noopener">Open the chart on DexScreener</a></p>'+'<p style="color:var(--mute);font-size:14px">If the chart does not load, use the link above. Prices move fast and nothing here is financial advice.</p>'}},
{id:"holder-rewards",t:"Holder Rewards",h:function(){return '<h1>Holder Rewards</h1><p class="sub">A cut of referral fees, paid to your wallet</p>'+'<div class="card"><p><b>How to qualify</b></p><p>Hold at least 0.1 SOL worth of BLF to access a cut of referral fees. Payouts are sent automatically to your wallet, so there is nothing to claim.</p></div>'+'<div class="grid"><div class="card stat"><b>0.1 SOL</b>Minimum hold</div><div class="card stat"><b>Automatic</b>Paid to your wallet</div></div>'+'<p>This sits on top of the 2% tax, where half goes to holders and half to buybacks and burns.</p>'+'<p style="color:var(--mute);font-size:14px">Rewards depend on referral activity and are not guaranteed. Nothing here is financial advice.</p>'}},

{id:"ape-responsibly",t:"Ape Responsibly",h:function(){return '<h1>Ape Responsibly</h1><p class="sub">Tools and good habits for the degen life</p>'+

var main=document.getElementById("main"),links=document.getElementById("links"),nav=document.getElementById("nav");
function list(f){links.innerHTML="";P.forEach(function(p){if(f&&p.t.toLowerCase().indexOf(f)<0&&p.h().toLowerCase().indexOf(f)<0)return;var a=document.createElement("a");a.href="#"+p.id;a.textContent=p.t;a.className=(cur()===p.id)?"on":"";links.appendChild(a)})}
function cur(){var h=location.hash.slice(1);return P.some(function(p){return p.id===h})?h:P[0].id}
function render(){var id=cur(),i=P.findIndex(function(p){return p.id===id}),p=P[i];
 var pr=P[i-1],nx=P[i+1];
 main.innerHTML=p.h()+'<div class="pn">'+(pr?'<a href="#'+pr.id+'"><small>Previous</small>'+pr.t+'</a>':'<span style="flex:1"></span>')+(nx?'<a href="#'+nx.id+'"><small>Next</small>'+nx.t+'</a>':'<span style="flex:1"></span>')+'</div><footer>Last updated November 2026. Not financial advice.</footer>';
 list(document.getElementById("q").value.toLowerCase());nav.classList.remove("open");window.scrollTo(0,0);
 var cp=document.getElementById("cp");if(cp)cp.onclick=function(){try{navigator.clipboard.writeText(CA).then(function(){document.getElementById("ok").textContent="Copied"})}catch(e){document.getElementById("ok").textContent="Select and copy manually"}}}
window.addEventListener("hashchange",render);
document.getElementById("q").addEventListener("input",function(e){list(e.target.value.toLowerCase())});
document.getElementById("menu").onclick=function(){nav.classList.toggle("open")};
var bg=document.getElementById("bg"),snd=document.getElementById("snd"),want=true;bg.volume=0.25;
function setL(){snd.textContent=bg.paused?"Music: off":"Music: on"}
function playIt(){try{var r=bg.play();if(r&&r.then)r.then(setL).catch(setL)}catch(e){}}
snd.onclick=function(e){e.stopPropagation();if(bg.paused){want=true;playIt()}else{want=false;bg.pause();setL()}};
function first(){document.removeEventListener("pointerdown",first);if(want&&bg.paused)playIt()}
document.addEventListener("pointerdown",first);
bg.addEventListener("play",setL);bg.addEventListener("pause",setL);
playIt();setL();
render();
</script>
</body>
</html>
